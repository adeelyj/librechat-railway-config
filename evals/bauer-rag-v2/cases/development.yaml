      "category": "exact_certificate",
      "prompt_en": "Find the English EN ISO 3834-2 certificate for Bauer Kompressoren in Munich. Return the precise certificate title, organization, address, language, and source document. Do not substitute an ISO 9001 or ISO 14001 certificate."
    },
    {
      "id": "B14",
      "category": "safe_no_match",
      "prompt_en": "Find a previous synthetic helium booster project for 420 bar and approximately 500 l/min. Apply medium, pressure, and topology as mandatory constraints. If no compatible synthetic project exists, say so clearly. Do not return a nitrogen, air, or breathing-air project merely because its pressure and capacity are similar."
    },
    {
