version: 1.3.13

cache: true

fileStrategy: "s3"

interface:
  endpointsMenu: true
  modelSelect: true
  parameters: true
  presets: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: false
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true

registration:
  socialLogins: []

endpoints:
  custom:
    - name: "RapidDraft Local AI"
      apiKey: "${LOCALAI_CHAT_API_KEY}"
      baseURL: "${LOCALAI_CHAT_BASE_URL}"
      models:
        default:
          - "local/qwen-coder"
          - "local/qwen-vision-fast"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "local/qwen-coder"
      summarize: false
      summaryModel: "local/qwen-coder"
      modelDisplayLabel: "RapidDraft Local AI"
